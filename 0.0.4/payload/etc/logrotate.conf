# Delin logrotate configuration -- see the logrotate(8) subset.
# Everything before the first path is the global default; each "/path { ... }" section overrides
# it.
# Directives: size N[k|M] / daily|weekly|monthly / rotate N / create [mode [owner [group]]]
#       notifempty / missingok
# Unsupported directives (compress/postrotate/dateext/...) are an error, never silently ignored.

size 4096
rotate 4
create 0644 root root
notifempty
missingok

/var/log/messages {
    size 4096
    rotate 4
}

/var/log/secure {
    size 4096
    rotate 4
}

/var/log/kern.log {
    size 4096
    rotate 4
}
