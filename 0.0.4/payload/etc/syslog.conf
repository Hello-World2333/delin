# Delin syslogd rules -- see the syslog.conf(5) subset.
#   selector                action
# selector = facility[.severity], comma separated entries, semicolon separated groups;
# facility: kern user mail daemon auth syslog lpr news uucp cron authpriv ftp local0..7 or *
# severity: emerg alert crit err warning notice info debug or * / none (excluded)
# severity means that level and everything more severe (a smaller number). One message may match
# several rules (and is then written to several files).
# action: a file path (a leading - means no fsync; Delin always flushes immediately, so the
# prefix is ignored) or /dev/console.

*.info;authpriv.*;kern.*        /var/log/messages
authpriv.*                      /var/log/secure
kern.*                          /var/log/kern.log
*.emerg                         /dev/console
