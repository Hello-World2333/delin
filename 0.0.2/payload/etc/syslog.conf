# Delin syslogd 规则 —— 见 syslog.conf(5) 子集。
#   selector                action
# selector = facility[.severity], 逗号分隔多项, 分号分隔多组;
# facility: kern user mail daemon auth syslog lpr news uucp cron authpriv ftp local0..7 或 *
# severity: emerg alert crit err warning notice info debug 或 * / none(排除)
# severity 语义: 该等级及更严重(数值更小)的消息。一条消息可命中多条规则(写多个文件)。
# action: 文件路径(- 前缀表示不 fsync, Delin 恒立即 flush, 前缀被忽略)或 /dev/console。

*.info;authpriv.*;kern.*        /var/log/messages
authpriv.*                      /var/log/secure
kern.*                          /var/log/kern.log
*.emerg                         /dev/console
