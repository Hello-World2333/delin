# Delin /etc/mdadm.conf -- see mdadm.conf(5).
#
# Every "ARRAY" line names one software RAID array to assemble at boot: init hooks
# /lib/systemd/system/mdadm.service into local-fs-pre.target, and that unit runs
#   /bin/mdadm --assemble --scan
# which assembles exactly the arrays listed here, before any filesystem is mounted.
# A configuration file with no ARRAY line assembles nothing (boot is not affected).
#
# Write an array into this file with:
#   mdadm --detail --scan >> /etc/mdadm.conf
#
# Recognized keys (case-insensitive): uuid=, name=, level=, num-devices=, spares=,
# devices= (comma separated). metadata=/bitmap=/container=/member=/super-minor= are
# accepted and ignored (Delin only implements 1.2 metadata without a bitmap).
#
# Example:
# ARRAY /dev/md0 metadata=1.2 name=md0 UUID=01234567:89abcdef:01234567:89abcdef
# ARRAY /dev/md1 level=raid5 num-devices=3 devices=/dev/sdb1,/dev/sdc1,/dev/sdd1
