# Delin logrotate 配置 —— 见 logrotate(8) 子集。
# 第一条路径之前是全局默认; 每段 "/path { ... }" 覆盖默认。
# 指令: size N[k|M] / daily|weekly|monthly / rotate N / create [mode [owner [group]]]
#       notifempty / missingok
# 未支持的指令(compress/postrotate/dateext/...)一律报错, 不做静默忽略。

size 4096
rotate 4
create 0644 root root
notifempty
missingok

/var/log/messages {
    size 4096
    rotate 4
}

/var/log/secure {
    size 4096
    rotate 4
}

/var/log/kern.log {
    size 4096
    rotate 4
}
